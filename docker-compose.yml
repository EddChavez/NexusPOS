services:
  nexuspos-postgres:
    image: postgres:16-alpine
    container_name: nexuspos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuspos
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
